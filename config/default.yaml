# Defaults for contract-analyst. Values marked E1/E3/E4 are set from experiment winners; the model is the caller's choice.
llm_model: "ollama:qwen3:8b"          # default; any ollama:<model> or openai:<model>
ollama_url: "http://localhost:11434"   # overridden by CA_OLLAMA_URL; a non-loopback host needs CA_ALLOW_REMOTE_LLM=1
openai_base_url: "http://localhost:8000/v1"  # for llm_model openai:<model> (vLLM, LM Studio, ...); CA_OPENAI_BASE_URL, key in CA_OPENAI_API_KEY
# Server-specific request fields for openai:<model>: switch a reasoning model's thinking off for extraction and on
# for the agent. Measured: Ollama /v1 obeys reasoning_effort none (ignores think and chat_template_kwargs);
# vLLM / SGLang with Qwen3: {chat_template_kwargs: {enable_thinking: false}} and ... true for thinking turns.
openai_extra_body: {}
openai_think_extra_body: {}
llm_num_ctx: 16384
llm_batch_tokens: 6000
llm_money_batch_tokens: 3000           # rates: a quote per table row (~80 answer tokens on qwen3:8b); at 6000 the 8B answer looped past llm_max_tokens on 3 documents
# Output caps. Ollama's own default is unlimited with context shifting, so a degenerate answer streams forever.
# A field group's JSON rarely needs 2000 tokens: 4096 leaves 2x headroom, and a full batch (6000) + prompt (~1500)
# + 4096 stays inside num_ctx, so even a capped answer never shifts the context.
llm_max_tokens: 4096                   # every call without thinking: extraction, planner, reflector, chat
llm_think_max_tokens: 4096             # a thinking turn: thinking + tool calls; ~3 min at ~25 tok/s. Too low a cap
                                       # cuts the tool calls off (the turn ends empty): watch llm_usage.truncated
llm_keep_alive: 30m                    # keep the model loaded between the calls of a run
llm_call_deadline: 900                 # seconds per call, wall clock: then the stream is closed and Ollama aborts
llm_cache_mode: record                 # record | replay | off

ocr_engine: rapidocr                   # E1 winner (docs/experiments/e1_ocr.md): tesseract | rapidocr
ocr_preprocess: none                   # E1 winner: none | deskew_sauvola
ocr_dpi: 300
ocr_word_conf_threshold: 0.90          # E1: synthetic rule gives 0.55; real scans need 0.90 for precision 1.0
ocr_quote_fuzzy_threshold: 90
text_layer_min_chars: 50
low_quality_ratio: 0.2

agent_variant: B                       # E4: A | B | C
consolidation_mode: code               # E3: code | llm
max_steps: 60                          # every tool call counts, invalid ones too
max_seconds: 7200                      # agent wall clock; a local 8B spends ~1 h of tool time on 16 documents
max_tool_errors_in_row: 5              # then the agent stops acting and the reflector decides
max_reflection_rounds: 2
agent_thinking: true                   # Qwen3 thinking for the executor; it is logged as the agent's thoughts

subject_categories:
  commercial_representation: "Коммерческое представительство"
  partner_promotion: "Партнёрское продвижение"
  sales_targets_agreement: "Соглашение о плановых показателях"
  lease: "Аренда"
  sale: "Купля-продажа"
  services: "Оказание услуг"
  supply: "Поставка"
  other: "Иное"

# Key order = order of LLM calls. A new field needs only an entry here and in field_descriptions.
field_groups:
  header: [kind, number, doc_date, city, parent, effective_from, effective_to, parties, subject_category]
  core_terms: [subject, validity, payment_terms, termination, notification_channel, penalties]
  money: [rates]
  dealer: [plan_indicators, tariff_groups, trade_points]
  ops: [ops]

field_descriptions:
  kind: "Вид документа: основной договор, дополнительное соглашение, рамочное соглашение или неизвестно"
  number: "Номер документа из заголовка"
  doc_date: "Дата подписания документа"
  city: "Город заключения документа"
  parent: "Номер и дата договора, к которому относится соглашение, как они написаны в тексте"
  effective_from: "Дата вступления документа в силу или дата, с которой он распространяет действие"
  effective_to: "Дата, до которой действует сам документ, если она указана (например, соглашение на один месяц)"
  parties: "Стороны: роль, организационно-правовая форма, наименование"
  subject_category: "Категория предмета договора из закрытого списка"
  subject: "Предмет договора: что одна сторона поручает или передаёт другой"
  validity: "Срок действия договора: дата окончания или порядок пролонгации"
  payment_terms: "Порядок и сроки расчётов и выплат"
  termination: "Порядок и основания расторжения"
  notification_channel: "Способ и адреса для уведомлений и обмена документами"
  penalties: "Штрафы и неустойки: за что и в каком размере"
  rates: "Ставки цены или вознаграждения: название, сумма, НДС, период действия"
  plan_indicators: "Плановые показатели продаж или начислений"
  tariff_groups: "Группы тарифных планов и их состав"
  trade_points: "Торговые точки, на которых исполняется договор"
  ops: "Операции изменения: какой пункт, раздел, приложение или документ меняется и с какой даты"

critical_fields: [number, doc_date, parent, effective_from, rates, ops]
