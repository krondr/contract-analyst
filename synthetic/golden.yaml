# Эталон отложенного синтетического набора (схема GoldenSet, правила — docs/golden_guide.md).
# Все стороны, адреса и номера вымышленные (D99xxxxxxx-01), формулировки свои. Ответы известны по построению:
# тексты — synthetic/sources, файлы — synthetic/build (scripts/make_synthetic.py). На этом наборе ничего не
# настраивается: он проверяет, что агент обобщается за пределы реального архива.
#
# doc_id = sha256[:12] собранного файла. Если пересборка меняет doc_id, make_synthetic.py заменяет его здесь сам.
# Значения условий из документов помечены якорями (&) и повторяются в свёртке ссылками (*).
# Скан договора аренды: Tesseract (rus) читает латинскую D в номере как 0 («№ 0990100001-01»), поэтому цитата номера
# взята с изображения и находится в тексте OCR нечётким сравнением; верный номер известен по построению.

version: 1
as_of_dates: [2026-10-30, 2027-02-01]

