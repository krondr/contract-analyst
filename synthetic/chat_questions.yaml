# Вопросы для чата по отложенному синтетическому набору (формат — docs/golden_guide.md, «Вопросы для чата»).
# Состав: 4 факта (q1, q4, q5, q7), 2 об истории условий (q2, q6), 1 уточнение к предыдущему вопросу (q3),
# 1 вопрос без ответа в документах (q8). Даты в expected_facts — ДД.ММ.ГГГГ, суммы — с пробелом между разрядами:
# сравнивать их как даты и числа, а не как строки.

- id: q1
  question: "Какая арендная плата действует на 30.10.2026 по договору аренды D990100001-01?"
  expected_facts: ["120 000", "без НДС"]
  unanswerable: false
  follow_up_of: null

- id: q2
  question: "Как менялась арендная плата по договору D990100001-01?"
  expected_facts: ["100 000", "120 000", "01.04.2025", "D990100002-01"]
  unanswerable: false
  follow_up_of: null

- id: q3
  question: "А срок аренды по нему продлевали? До какой даты он действует?"
  expected_facts: ["31.12.2026", "D990100003-01"]
  unanswerable: false
  follow_up_of: q2

- id: q4
  question: "Действует ли договор оказания услуг D990200001-01 на 30.10.2026?"
