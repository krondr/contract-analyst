# Third clean golden set (docs/golden_guide.md). Built by scripts/make_clean3.py from clean3/sources.
# Written without reading the system's code, rules, prompts, configuration, unit tests or the texts of the other sets.
# Values are what a careful lawyer reads in each document (Civil Code of the Russian Federation, usual contract
# practice).
#
# Annotation decisions (for adjudication):
# - Counterparty: the party that performs under the contract (Исполнитель, Арендодатель, Агент); the other party is
#   the customer of the set.
# - Start of a document (effective_from):
#   * a date stated for the whole document («начинает действовать с 01.04.2025», «вводятся в действие с 1 сентября
#     2026 г.») -> that date;
#   * start at signing, in any wording («вступает в действие в дату его подписания», «с даты, указанной в его
#     заголовке», «с даты его заключения», «после его подписания обеими Сторонами», «начинает действовать со дня
#     подписания», «немедленно после подписания») -> the document's own date; the quote is the dated header line;
#   * a clause saying from which date some changes apply («применяется к Испытаниям образцов, поступивших … с …»,
#     «применяется к выездам, выполненным с …», «подлежат применению с …») does not move the document's start: it
#     dates those changes only (rates' valid_from, ops' effective_from) and is not an operation of its own;
#   * the entry-into-force clause inside a contract text restated by a supplement («Договор вступает в силу с даты его
#     заключения …» in D952000002-01) belongs to the restated contract, not to the supplement;
#   * a document that says nothing about its start -> effective_from absent; its operations get no effective_from
#     either, and in the chains its changes apply on both as_of dates, which are after signing.
# - effective_to of a main contract: the end date it states; «до полного исполнения Сторонами своих обязательств» is
#   no date -> absent. A supplement that extends the contract does not get the new end as its own effective_to: the
#   new end is the chain's validity.
# - VAT: a table header applies to every row of its table; a clause «Все суммы, указанные в Договоре, включают налог на
#   добавленную стоимость» applies to every sum of that contract text. «НДС не включён» -> excluded; «с учётом НДС»,
#   «в том числе налог на добавленную стоимость» -> included. The VAT amount inside a price («в том числе налог на
#   добавленную стоимость 600 (шестьсот) рублей») is not a rate. Fees that say nothing about VAT -> unknown.
# - Not rates: a surcharge in percent of a price («увеличивается на 50 %»), a security deposit, a refund of
#   electricity at the supplier's tariff (no amount), fines and penalties.
# - Appendix 1 restated by a supplement -> replace_appendix «Приложение 1»; the whole contract restated ->
#   restate_document with no target. Rates of the restated text are the supplement's rates; a rate the new wording
#   drops (the sticker fee) no longer applies from the restatement's start.
# - «Пункт X Договора исключить» -> delete_clause X. A deleted fine is gone from the chain's penalties; the deleting
#   document itself has no penalties term.
# - A reference «№ D952000001-01 от 1 сентября 2025 г. (в редакции дополнительного соглашения № D952000002-01 …)» has
#   the contract as its parent.
# - Termination «прекращают действие … с X», X before both as_of dates: status terminated on both; terms_at {} and
#   rates_at [] on both.
# - A supplement changes only the clauses it names; the chain's term holds the merged wording.
# - Scan quotes are copied from the OCR text (the Latin D of the numbers reads as the digit 0); values are canonical.
# - Rates of a document carry no valid_to of their own; chains carry valid_to where a later signed document ends them.
