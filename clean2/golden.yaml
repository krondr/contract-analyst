# Second clean golden set (docs/golden_guide.md). Built by scripts/make_clean2.py from clean2/sources.
# The final independent check: written without reading the system's code, rules, prompts, unit tests or the texts of
# the other sets. Values are what a careful lawyer reads in each document.
#
# Annotation decisions (for adjudication):
# - Counterparty: the party that performs under the contract (Партнёр, Перевозчик, Арендодатель); the other party is
#   the customer of the set.
# - Start of a document (effective_from):
#   * a date stated for the whole document («вступает в силу 01 мая 2025 года», «вступает в силу с 01.03.2026»,
#     «распространяется на отношения Сторон, возникшие с …») -> that date, wherever the clause stands;
#   * start at signing, in any wording («со дня подписания Сторонами», «с момента его подписания», «с даты подписания
#     его Сторонами», «в день его подписания уполномоченными представителями», «в момент его подписания обеими
#     Сторонами») -> the document's own date; the quote is the dated header line, where the date is written;
#   * a clause saying from which date some changes apply («применяются к Активациям, совершённым с …», «вводится с …»)
#     does not move the document's start: it dates those changes only (rates' valid_from, ops' effective_from), and it
#     is not an operation of its own; neither is a closing clause on entry into force;
#   * a document that says nothing about its start -> effective_from absent; its operations get no effective_from
#     either (nothing is written), and in the chains its changes apply on both as_of dates, which are after signing.
# - VAT: a table header applies to every row of its table. «без налога на добавленную стоимость», «без учёта налога
#   на добавленную стоимость», «НДС … исчисляется дополнительно», «налог на добавленную стоимость начисляется … сверх»,
#   «кроме того, … уплачивает налог на добавленную стоимость», «налог на добавленную стоимость … не включён» ->
#   excluded; «включая налог на добавленную стоимость», «в том числе налог на добавленную стоимость», «включая НДС» ->
#   included. A clause that only changes an amount keeps the VAT wording of the clause it changes.
# - Kopecks are written in rubles: «41 (сорок один) рубль 25 копеек» -> 41.25, «38 руб. 40 коп.» -> 38.40.
# - Plan tables (activations, share of a subscription kind, planned user payments) are plan indicators, not rates. A
#   surcharge paid per activation when the plan is met is a rate. Fines counted from the reward or the tariff, fixed
#   fines «за каждое нарушение» / «за каждый случай» and fines in a multiple of the reward are penalties, not rates.
# - A change to a row of a table that another supplement put into the contract is one operation on that supplement's
#   clause: target «D961000002-01 п. 2».
# - «утрачивает силу с X» for an earlier supplement -> invalidate_document with effective_from X; the supplement is in
#   `invalidated`; both as_of dates are after X, so none of its changes apply on them.
# - Termination «считается расторгнутым с X»: status terminated from X; validity keeps its wording; rates in force
#   before X get valid_to = the day before X; on a date after X the chain has terms_at {} and rates_at [].
# - A supplement changes only the clauses it names; when it rewrites one clause of a multi-clause term, the document's
#   term holds the new clause, the chain's term holds the merged wording.
# - Numbers written with an en or em dash are given in the normalized form; the quote is taken where the document writes
#   the same number with a hyphen.
# - Scan quotes are copied from the OCR text (the Latin D of the numbers reads as the digit 0); values are canonical.
# - Rates of a document carry no valid_to of their own; chains carry valid_to where a later document ends them.
version: 1
as_of_dates: [2026-10-30, 2027-02-01]

