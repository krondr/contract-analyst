# Held-out golden set (docs/golden_guide.md). Built by scripts/make_holdout.py from holdout/sources.
# Written without reading the system's rules, prompts, tests or the synthetic set.
#
# Annotation decisions (for adjudication):
# - Consolidation (project owner's rule): a supplement changes only the clauses it names; other clauses stay in force;
#   a supplement that only adds obligations adds to the term as «прежнее; новое».
# - "НДС не облагается" (seller on the simplified tax system) -> vat: excluded (the amount carries no VAT).
# - A chain that is terminated on an as_of date has no terms or rates in force: terms_at {} and rates_at [].
# - A termination agreement does not rewrite the validity clause: validity keeps its wording, status_at carries the
#   termination; rates in force before the termination date get valid_to = the last day of service.
# - A document that enters into force «с даты подписания» gets effective_from = its own date; the quote is the dated
#   header line, the only place that date is written (the checker needs the date inside the quote).
# - Scan quotes are copied from the OCR text (PAGE ... (ocr)); OCR reads the Latin D of the numbers as Cyrillic Д,
#   values are written in the canonical form.
# - The confidentiality agreement D984000001-01 refers to contract D983000001-01 only in its definitions and changes
#   nothing in it: kind framework, parent_* recorded as written, and it forms its own one-document chain.
