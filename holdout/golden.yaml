      Глеба Аркадьевича, действующего на основании Устава, и АО «Линтерра Телеком»
      (Покупатель) в лице директора по закупкам Ершовой Алины Викторовны, действующей
      на основании доверенности № 52/24 от 09.12.2024, заключили настоящее
      Дополнительное соглашение о нижеследующем.
      1. В Договор вносятся следующие изменения:
      1.1. Пункт 5.1 Договора изложить в следующей редакции:
      «5.1. Договор вступает в силу с даты его подписания Сторонами и действует по 31 декабря
      2027 года включительно. Если ни одна из Сторон не позднее чем за 30 (тридцать)
      календарных дней до окончания срока действия Договора не заявит о его прекращении,
      Договор считается продлённым на каждый следующий календарный год.»
      1.2. В пункте 2.3 Договора слова «в течение 30 (тридцати) календарных дней» заменить
      словами «в течение 45 (сорока пяти) календарных дней».
      2. Настоящее Дополнительное соглашение вступает в силу с даты его подписания и
      является неотъемлемой частью Договора.
      3. В остальном Стороны руководствуются условиями Договора, не затронутыми
      настоящим Дополнительным соглашением.
      Поставщик: ООО «Сурский кабельный завод» Покупатель: АО «Линтерра Телеком»
