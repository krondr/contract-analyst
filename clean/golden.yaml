# Clean golden set (docs/golden_guide.md). Built by scripts/make_clean.py from clean/sources.
# Written before the next round of rule changes, without reading the system's rules, prompts, unit tests or the texts
# of the synthetic and held-out sets. Values are what a careful lawyer reads in each document.
#
# Annotation decisions (for adjudication):
# - Consolidation: a supplement changes only the clauses it names; other clauses stay in force; a supplement that
#   only adds obligations adds to the term as «прежнее; новое».
# - "НДС не облагается" (contractor on the simplified tax system) -> vat: excluded. VAT stated only in a table header
#   applies to every row of that table. «сверх того НДС», «не включают НДС», «без учёта НДС», «Сверх указанной суммы
#   ... уплачивает налог на добавленную стоимость» -> excluded; «включая НДС», «в том числе НДС», «включает НДС» ->
#   included. A clause that changes only an amount keeps the VAT wording of the clause it changes.
# - Amounts written with kopecks are written in rubles: «245 рублей 50 копеек» -> 245.50, «87 копеек» -> 0.87.
# - Sales plan figures (connections, revenue per quarter) are plan indicators, not rates. A bonus paid per subscriber
#   when the plan is met is a rate. Penalties counted from the reward or the rent, or fixed «за каждое нарушение»,
#   are penalties, not rates.
# - A closing clause «вступает в силу с даты подписания» is not an operation; a clause saying from which date the
#   changed wording applies is not a separate operation either: it gives the effective_from of the operations it names.
# - effective_from of a document: its entry into force; «распространяет своё действие на отношения, возникшие с X»
#   -> X. A document that enters into force «с даты подписания» gets its own date; the quote is the dated header line.
# - An operation on a clause of another supplement: target is that supplement's number plus the clause
#   («D971000002-01 п. 3»). It is one operation; the contract clause it rewrites through that supplement is not listed
#   again.
# - «признать утратившим силу с даты X» an earlier supplement -> invalidate_document with effective_from X; that
#   supplement is listed in `invalidated`. It was in force before X; both as_of dates are after X, so none of its
#   changes apply on them.
# - A termination agreement does not rewrite the validity clause: validity keeps its wording, status_at carries the
#   termination; rates in force before the termination date get valid_to = the last day of the lease.
# - A chain terminated on an as_of date has no terms or rates in force: terms_at {} and rates_at [].
# - Numbers with a dash other than a hyphen are written in the normalized form; the quote is taken where the document
#   writes the same number with a hyphen.
# - Scan quotes are copied from the OCR text; OCR reads the Latin D of the numbers as the digit 0, values are written
#   in the canonical form.
# - Rates of a document carry no valid_to of their own; chains carry valid_to where a later document ends them.
